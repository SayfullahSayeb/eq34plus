name: Build & Release APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Build Release APK
      run: ./gradlew assembleRelease

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: EQ34Plus-debug-${{ github.ref_name }}
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: EQ34Plus-release-${{ github.ref_name }}
        path: app/build/outputs/apk/release/app-release-unsigned.apk
        retention-days: 90

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        name: "HOCO EQ34 Plus Controller ${{ github.ref_name }}"
        body: |
          ## HOCO EQ34 Plus Controller
          
          ### What's New
          - See commit history for changes
          
          ### Installation
          1. Download the APK below
          2. Enable "Install from unknown sources" on your Android device
          3. Install the APK
          
          ### Files
          - `EQ34Plus-debug-*.apk` - Debug build (for testing)
          - `EQ34Plus-release-*.apk` - Release build (recommended)
        files: |
          app/build/outputs/apk/debug/app-debug.apk
          app/build/outputs/apk/release/app-release-unsigned.apk
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
